viour":"后端通过 node:sqlite 打开 listenings.sqlite，启用 WAL 和外键；结构版本为 12。Key 在浏览器 localStorage 和后端运行期内存使用，不随数据库导出。","evidence":"source","sources":["storage","entry","prefs","fish_key","export","import"]},{"id":"correction","domainId":"knowledge","label":"人工名称纠正","kind":"console","description":"把误识别词直接替换为用户指定的新名称，例如 Deebo → Tibo。","inputs":["新名称与 revision","关联句子和引用"],"outputs":["名称、原文与引用同步更新","可沿用的当前收听纠正规则"],"behaviour":"统一入口；手动保存无需模型。通过版本校验后，在一个事务中替换相关内容并调整引用偏移，保留条目和关系 ID。模型只在点击获取建议时调用。","evidence":"source","sources":["manual","revision_guard","editor","edit_api"]},{"id":"observe","domainId":"diagnostics","label":"执行追踪仪","kind":"memory","description":"默认采集关键后端链路，按业务域组织任务、调用和安全事件。","inputs":["识别、翻译、知识、关系、播报的事件"],"outputs":["execution_trace 日志","有界诊断快照与离线报告"],"behaviour":"server.mjs 创建运行时即开启追踪，无需 HEARWISE_TRACE=1。Effect 管理取消和子步骤；业务报告再按五个域归类。这里没有实测日志，因此活动、耗时和 token 均未知。","evidence":"source","sources":["entry","runtime","diagnostics","trace_steps","business"]},{"id":"audio_source","domainId":"recognition","label":"音源选择器","kind":"console","description":"浏览器获取用户授权的声音。","inputs":["麦克风或标签页选择"],"outputs":["MediaStream"],"behaviour":"麦克风调用 getUserMedia，标签页调用 getDisplayMedia；同一次收听可追加新的片段。源音频不在服务端直接读取。","evidence":"source","sources":["audio"],"parentId":"capture"},{"id":"pcm_frames","domainId":"recognition","label":"PCM 分帧器","kind":"processor","description":"AudioWorklet 将采样统一为识别输入。","inputs":["浏览器输入样本"],"outputs":["16 kHz / PCM16 / 单声道"],"behaviour":"每包 320 个样本，即 20 ms 音频；必要时插值重采样。结束时 flush 剩余尾包。浏览器 socket 缓冲达到 512,000 字节时该发送分支不再发送新包；此处未实现持久重传队列。","evidence":"source","sources":["pcm","audio","stop"],"parentId":"capture"},{"id":"recognition_session","domainId":"recognition","label":"ASR 会话","kind":"router","description":"本地 WebSocket 连接到千问流式识别服务。","inputs":["PCM 包、语言、断句参数"],"outputs":["sentence 文本与句子身份"],"behaviour":"模型为 qwen-audio-3.0-asr-flash-streaming。服务端收到 task-started 才创建收听 run；附加断句参数被拒绝时可回退重连。识别会话自身有追踪。","evidence":"source","sources":["asr","entry"],"parentId":"capture"},{"id":"source_commit","domainId":"recognition","label":"定稿分流器","kind":"router","description":"同一个最终句在落盘后分流到多个业务。","inputs":["sentence_end=true 的 ASR 文本"],"outputs":["segments 记录","定稿通知、翻译任务、知识合批"],"behaviour":"按 run 与 sentence_id 去重。新增句先 addSegment，再通知播报、发送 segment-final，并安排翻译和知识。冲突定稿保留首次文本且停止相关播报。","evidence":"source","sources":["asr","storage"],"parentId":"capture"},{"id":"mt_preview","domainId":"translation","label":"临时预览入口","kind":"console","description":"为当前字幕请求临时译文。","inputs":["未定稿文本与请求版本"],"outputs":["临时译文或最终译文优先提示"],"behaviour":"前端按约 1.2 秒节流；超过 3000 个 JS 字符等待定稿，不截断原文。服务端只在定稿队列空且共享工位可用时准入；忙时返回 429，不等同于云服务限流。","evidence":"source","sources":["preview","preview_api"],"parentId":"translate"},{"id":"mt_schedule","domainId":"translation","label":"共享翻译工位","kind":"queue","description":"实时最终句、历史补齐和播报队首共同竞争执行机会。","inputs":["按 segment.id 去重的任务"],"outputs":["下一项可执行翻译"],"behaviour":"总并发 2；最新 2 个实时待译句形成窗口。连续派发 3 个实时任务且最老后台已等 10 秒时，让给后台。播报队首在既有预算中交替优先。500 是内存清单软阈值：超出时只尝试移走最老后台任务，完整待办仍在 SQLite。","evidence":"source","sources":["mt_queue","mt_commit"],"parentId":"translate","mechanism":{"concurrency":2}},{"id":"mt_http","domainId":"translation","label":"翻译模型","kind":"processor","description":"将原文交给 qwen-mt-flash。","inputs":["原文、目标语言、API Key"],"outputs":["译文字符串"],"behaviour":"HTTP 请求默认 15 秒超时；同语言明确匹配走本地直通，auto 仍调用模型。请求被取消或输出为空不能作为成功译文提交。","evidence":"source","sources":["mt","mt_commit","preview_api"],"parentId":"translate"},{"id":"mt_commit","domainId":"translation","label":"译文提交与通知","kind":"database","description":"保存最终译文，再唤醒等待者。","inputs":["翻译结果或失败"],"outputs":["translation_state","translation-updated"],"behaviour":"更新 segments 后广播，并调用 speech.notify；失败保存 failed 状态。继续处理从 pendingTranslations 恢复，临时译文不写入最终译文位置。","evidence":"source","sources":["mt_commit"],"parentId":"translate"},{"id":"speech_consumer","domainId":"speech","label":"播报消费会话","kind":"console","description":"每个播放连接有独立游标、epoch、暂停和退出状态。","inputs":["用户开启/暂停/跳转/停止"],"outputs":["顺序语音单元与状态"],"behaviour":"实时播报只取开启之后的句子；全文播报读取整条记录，包含未加载的句子。实时停止后默认最多等 20 秒收尾，暂停时间另计；暂停最长 5 分钟，全文不受实时收尾窗口限制。","evidence":"source","sources":["speech","speech_control"],"parentId":"speech"},{"id":"speech_units","domainId":"speech","label":"文本切段与账本","kind":"queue","description":"最终文本按句切段；提前播报使用独立原文覆盖账本。","inputs":["最终译文或全文文本","可选稳定英文前缀"],"outputs":["待合成文本单元"],"behaviour":"全文根据语速按标点和词界切分，完整保留正文。提前播报仅在本次会话明确开启且英语→中文时启用；已播前缀若被修订就停止播报，不能把一般临时字幕当作可朗读文本。","evidence":"source","sources":["units","incremental","speech_control"],"parentId":"speech"},{"id":"speech_synthesis","domainId":"speech","label":"双服务商适配器","kind":"processor","description":"选择 Qwen 实时 TTS 或 Fish Audio。","inputs":["文本、音色、语速、服务商 Key"],"outputs":["逐块 PCM 音频或分类错误"],"behaviour":"Qwen 使用实时连接，Fish 使用 HTTP 流。适配器连接、生成和返回音频是不同阶段；音频到达后通过 /ws/tts 发送给浏览器。服务商模型及可选项以代码快照为准。","evidence":"source","sources":["qwen","fish","speech"],"parentId":"speech"},{"id":"speech_backpressure","domainId":"speech","label":"播放反压闸门","kind":"router","description":"用实际消费量限制超前生成，防止缓冲持续增长。","inputs":["已发送样本、已消费样本","已完成语音单元"],"outputs":["继续合成或暂停发起下一段"],"behaviour":"待播音频达到 4 秒，或未播完单元数达到 2 时，不再发起新一段。正在合成的流仍可能继续；未消费样本超过 32 秒或 socket 缓冲超过 1 MiB 时停止并提示。4 秒是发起阈值，不是硬容量。","evidence":"source","sources":["speech"],"parentId":"speech"},{"id":"speech_output","domainId":"speech","label":"浏览器扬声器","kind":"speaker","description":"环形缓冲把网络音频变成声卡采样，并回报播放进度。","inputs":["24 kHz PCM16 与单元编号"],"outputs":["扬声器输出","consumedSamples / playedUnit"],"behaviour":"缓冲默认最多 32 秒；连续输入先累积约 0.2 秒再开始，短尾段结束后可直接播放。播放器根据声卡采样率插值，单元实际播放完再回报；Media Session 提供系统可用的控制。","evidence":"source","sources":["playback","player","media"],"parentId":"speech"},{"id":"caption_original","domainId":"recognition","label":"原文显示","kind":"display","description":"未定稿识别文本立即进入当前原文区。","inputs":["sentence 消息"],"outputs":["当前句原文"],"behaviour":"临时原文用于反馈与可选提前播报观察；知识抽取只使用已保存的最终句。","evidence":"source","sources":["audio","asr"],"parentId":"caption"},{"id":"caption_preview","domainId":"recognition","label":"临时译文前沿","kind":"display","description":"保留已读内容，随当前句刷新译文。","inputs":["临时翻译结果"],"outputs":["可更新的大字幕"],"behaviour":"前端用 translationVersion 拒绝过时请求结果；没有新的结果时继续显示上次可读内容。","evidence":"source","sources":["preview","frontier"],"parentId":"caption"},{"id":"caption_final","domainId":"recognition","label":"定稿替换","kind":"display","description":"同句最终译文到达后替换预览。","inputs":["segment-final / translation-updated"],"outputs":["持久原译文与最终字幕"],"behaviour":"前端通过 runId、句子身份与当前焦点决定更新目标，后台补齐不应把焦点拉回旧句。","evidence":"source","sources":["audio","frontier"],"parentId":"caption"},{"id":"caption_notifications","domainId":"recognition","label":"状态与卡片更新","kind":"router","description":"后台处理结果经 WebSocket 和读接口回到页面。","inputs":["knowledge-upserted","processing / graph revision"],"outputs":["增量卡片、进度与图谱刷新"],"behaviour":"知识条目增量更新保留用户展开状态；图谱终态后读取最终结果。页面显示是持久化结果的投影，不拥有模型任务的最终状态。","evidence":"source","sources":["audio","graph","entry"],"parentId":"caption"},{"id":"knowledge_batch","domainId":"knowledge","label":"短暂合批仓","kind":"queue","description":"把连续到达的最终句打包为持久化抽取任务。","inputs":["segments 中尚未抽取的原文"],"outputs":["extraction_jobs"],"behaviour":"安静约 1.5 秒、达到 3 句或 1200 字符可触发；最长合批等待 4 秒。这些是触发条件，不是结果时延承诺。强制 flush 会排空尾部。","evidence":"source","sources":["kqueue","checkpoint"],"parentId":"knowledge"},{"id":"knowledge_schedule","domainId":"knowledge","label":"会话调度器","kind":"console","description":"同一收听串行，不同收听共享执行工位。","inputs":["持久任务、内存 Key、冷却时间"],"outputs":["获准执行的知识批次"],"behaviour":"默认跨收听并发 2，可由环境参数设为 1–4。翻译忙时准入上限降为 1，默认让路最多 1.5 秒，再在其他约束满足时运行；同收听开始间隔默认至少 2 秒。已在运行的任务不会被强制杀掉。","evidence":"source","sources":["entry","kqueue","provider"],"parentId":"knowledge","mechanism":{"concurrency":2}},{"id":"knowledge_extract","domainId":"knowledge","label":"抽取与本地校验","kind":"processor","description":"qwen3.8-flash 提议对象，本地代码检查身份与引用。","inputs":["focus 原文、上下文、已有候选"],"outputs":["合法条目","拒绝项与可修复目标"],"behaviour":"关闭 thinking，初次请求 30 秒超时。协议区分正式收录、观察和排除；原文引用必须能回到实际文本。没有符合条件的条目也可以成功结束。","evidence":"source","sources":["kmodel","kapi","kparse"],"parentId":"knowledge"},{"id":"knowledge_repair","domainId":"knowledge","label":"定向补全工位","kind":"tool","description":"保留成功项，针对有锚点的失败项补齐。","inputs":["未解决项、原对象身份与原文"],"outputs":["修复后的条目或未解决结果"],"behaviour":"每分片定向修复至多一次，15 秒请求超时；重试预算与请求次数存进检查点。额外请求预算默认 2，协议重试另有限制，不能理解为每个请求都固定重试两次。","evidence":"source","sources":["kworkflow","kapi"],"parentId":"knowledge"},{"id":"knowledge_checkpoint","domainId":"knowledge","label":"检查点提交器","kind":"database","description":"将条目和阶段进度一起保存。","inputs":["合法条目、未解决项、预算"],"outputs":["可恢复分片与页面通知"],"behaviour":"执行结果区分 continue 与 terminal、ok/empty/partial/invalid。保存成功项后广播；人工继续只重开未解决工作。旧策略任务保持自身协议，不能把新旧重试规则混在一起。","evidence":"source","sources":["kworkflow","checkpoint","entry"],"parentId":"knowledge"},{"id":"relation_windows","domainId":"relation","label":"证据窗口","kind":"memory","description":"为符合条件的原文范围准备关系输入。","inputs":["已有条目、最终原文、最终译文"],"outputs":["候选身份与证据 ID"],"behaviour":"最终译文辅助理解，原文决定证据。输入上限包括 48 个候选、12 个片段和 14,000 原文字符；这些是单请求协议上限。证据引用由服务端建立，模型不生成引用偏移。","evidence":"source","sources":["relation_contract","relation_evidence","relation_store"],"parentId":"relation"},{"id":"relation_admission","domainId":"relation","label":"后台准入闸门","kind":"router","description":"关系任务不能抢占正在进行的前台业务。","inputs":["窗口任务","前台忙状态与 provider 冷却"],"outputs":["等待原因或获准发起的请求"],"behaviour":"全局最多 2 个并发，默认发起间隔 2 秒、安静窗口 6 秒。翻译、知识任务或播报消费者存在时继续等；429 冷却在知识/关系间共享。等待本身不代表模型报错。","evidence":"source","sources":["entry","relation_queue","provider"],"parentId":"relation","mechanism":{"concurrency":2}},{"id":"relation_extract","domainId":"relation","label":"语义关系判定","kind":"processor","description":"模型判断明确表达的关系和限定条件。","inputs":["原文证据、候选 ID、辅助译文"],"outputs":["relations 与原文证据 ID"],"behaviour":"qwen3.8-flash，关闭 thinking。不按共现或传递性猜测；保留否定、计划、不确定性和时间。每窗口最多 3 次请求，单次 30 秒超时；确定性输入错误不应消耗付费重试。","evidence":"source","sources":["relation_workflow","relation_contract","relation_parse","kmodel"],"parentId":"relation","mechanism":{"retryLimit":2}},{"id":"relation_commit","domainId":"relation","label":"证据校验与提交","kind":"database","description":"本地校验引用和输入版本，再原子提交关系。","inputs":["模型候选、证据索引、窗口指纹"],"outputs":["持久关系、过滤诊断、进度"],"behaviour":"空结果与候选全部被过滤均可完成；请求、覆盖或保存问题才保留后续工作。取消或过期输入丢弃迟到响应；已完成付费请求的存储失败不会自动重放模型调用。","evidence":"source","sources":["relation_parse","relation_workflow","relation_store"],"parentId":"relation"},{"id":"relation_graph","domainId":"relation","label":"图谱观察窗","kind":"display","description":"已有知识条目与关系进入 Cytoscape 视图。","inputs":["正式条目、实际关系、筛选条件"],"outputs":["关联组件与独立节点分区"],"behaviour":"有关联的节点放上方，独立节点放下方；仅用真实关系计算布局。节点可看简介和原文，关系可看依据与限定。搜索、筛选、缩放和全屏都不需要模型调用。","evidence":"source","sources":["layout","renderer","graph"],"parentId":"relation"},{"id":"data_records","domainId":"data","label":"收听档案层","kind":"database","description":"一条收听包含多次 run，每个 run 包含最终句。","inputs":["收听、run 与 segment"],"outputs":["可分页历史与完整全文"],"behaviour":"唯一索引限制一条收听同时只有一个 active run；run + ASR 句子 ID 去重。segments 保存原文、译文和翻译状态；知识、事实、提及与关系通过 ID 关联。","evidence":"source","sources":["storage"],"parentId":"data"},{"id":"data_recovery","domainId":"data","label":"任务恢复层","kind":"memory","description":"重启后从持久化任务状态恢复工作。","inputs":["任务检查点与未完成状态"],"outputs":["待继续任务"],"behaviour":"启动将活动收听标为 interrupted，并恢复知识与关系检查点。运行期 Key 不在 SQLite 中；恢复模型任务需要显式提供内存 Key。停止采集后已排队翻译和知识仍可继续。","evidence":"source","sources":["storage","checkpoint","entry","mt_commit"],"parentId":"data"},{"id":"data_snapshot","domainId":"data","label":"一致性导出","kind":"database","description":"从数据库创建可独立使用的事务一致快照。","inputs":["当前 SQLite / WAL 状态"],"outputs":["完整 .sqlite 备份"],"behaviour":"使用 VACUUM INTO，把已提交但仍在 WAL 中的页纳入快照；不是简单复制正在使用的主文件。导出后检查完整性与数据库版本。","evidence":"source","sources":["export"],"parentId":"data"},{"id":"data_import","domainId":"data","label":"迁移与恢复","kind":"tool","description":"校验、预览、选择追加或覆盖，再事务提交。","inputs":["导入数据库与模式","预览 revision"],"outputs":["新增收听或替换后的档案"],"behaviour":"append 以 listening ID 判断：同 ID 整条跳过，不合并句子；replace 替换本地业务表内容。导入前备份并核验预览 revision，检查外键；执行时要求无冲突活动。","evidence":"source","sources":["import","export"],"parentId":"data"},{"id":"correct_editor","domainId":"knowledge","label":"统一编辑入口","kind":"console","description":"卡片与图谱详情打开同一个纠正名称交互。","inputs":["用户输入的新名称"],"outputs":["保存请求或获取建议请求"],"behaviour":"手动输入可直接保存；获取校对建议由用户明确点击，每次至多调用一次模型。建议并不自动生效。","evidence":"source","sources":["editor","edit_api"],"parentId":"correction"},{"id":"correct_guard","domainId":"knowledge","label":"并发版本闸门","kind":"router","description":"保存前检查对象和引用的版本。","inputs":["revision、jobId、新名称"],"outputs":["允许保存或 409 冲突"],"behaviour":"检查活动任务、已存在同名对象、纠正规则和内容指纹。相同 jobId 的重复请求读取既有结果；不允许一个任务 ID 携带另一份修改。","evidence":"source","sources":["manual","revision_guard","edit_api"],"parentId":"correction"},{"id":"correct_replace","domainId":"knowledge","label":"原子替换器","kind":"tool","description":"在关联原文和条目文本中替换误识别词。","inputs":["条目快照与新名称"],"outputs":["更新的原文、名称、引用与偏移"],"behaviour":"一个事务更新 canonical_name、关联句子、事实、引用与关系证据偏移；保留已有 ID 和已完成译文，不自动重译或重建图谱。英文按词边界且忽略大小写替换。","evidence":"source","sources":["manual"],"parentId":"correction"},{"id":"correct_rule","domainId":"knowledge","label":"纠正规则柜","kind":"memory","description":"将本次人工决定留给当前收听的后续识别使用。","inputs":["旧词、新词、条目身份"],"outputs":["当前收听有效的替换规则"],"behaviour":"规则持久化到 knowledge_corrections；后续临时原文和定稿沿用。规则限制在当前收听，其他收听与未关联历史段落不被批量改写。","evidence":"source","sources":["manual","asr"],"parentId":"correction"},{"id":"trace_lifecycle","domainId":"diagnostics","label":"Effect 生命周期","kind":"console","description":"将既有 Promise 操作包进可取消、有父子步骤的任务。","inputs":["任务标识与 operation"],"outputs":["任务结果、子 span 与清理"],"behaviour":"ManagedRuntime 管理 scope；AbortSignal 向子步骤传播。删除收听和关闭应用会取消所属任务。Effect 覆盖关键异步链路，不能推断整个代码库都已经改为 Effect。","evidence":"source","sources":["runtime","entry"],"parentId":"observe"},{"id":"trace_events","domainId":"diagnostics","label":"安全事件记录","kind":"memory","description":"记录状态、时间与白名单属性。","inputs":["running/event/succeeded/failed/cancelled"],"outputs":["有界事件缓存","execution_trace 行"],"behaviour":"默认 enabled=true，缓存默认 2000 条，上限 10,000。覆盖时计 dropped_events；stdout 背压或接收失败记 sink_errors。事件名和属性按白名单保留，追踪不记录模型正文或 API Key。","evidence":"source","sources":["diagnostics","entry","trace_steps"],"parentId":"observe"},{"id":"trace_business","domainId":"diagnostics","label":"业务归属透镜","kind":"processor","description":"把底层 span 归到用户能理解的业务对象。","inputs":["已采集事件与任务身份"],"outputs":["五个业务域及异常洞察"],"behaviour":"识别、翻译、知识、关系、播报分别聚合。已生成音频不能直接等同已播放；子步骤失败后恢复也保留历史。缺少起止记录表示证据不完整，不能自动断言任务仍在运行。","evidence":"source","sources":["business"],"parentId":"observe"},{"id":"trace_report","domainId":"diagnostics","label":"离线报告输出","kind":"display","description":"从已有日志构建可下钻的业务报告。","inputs":["execution_trace 日志或诊断快照"],"outputs":["业务域、任务、调用、时间线与证据"],"behaviour":"npm run trace:report 生成独立 HTML，不调用模型。耗时累计包含并行和父子重叠，不能当整次墙钟耗时。本解剖页默认没有日志；标准 Trace 导入入口不直接接受 HearWise 的逐事件日志。","evidence":"source","sources":["trace_report","diagnostics","business"],"parentId":"observe"}],"edges":[{"id":"e1","to":"caption","label":"临时与定稿消息","kind":"data","evidence":"source","sources":["asr","audio"],"from":"capture"},{"id":"e2","to":"data","label":"定稿先保存","kind":"data","evidence":"source","sources":["asr","storage"],"from":"capture"},{"id":"e3","to":"translate","label":"最终句触发翻译","kind":"data","evidence":"source","sources":["asr","mt_commit"],"from":"capture"},{"id":"e4","to":"knowledge","label":"最终原文触发合批","kind":"data","evidence":"source","sources":["asr","kqueue"],"from":"capture"},{"id":"e5","to":"caption","label":"预览结果与定稿通知","kind":"data","evidence":"source","sources":["preview","mt_commit"],"from":"translate"},{"id":"e6","to":"speech","label":"保存后唤醒播报","kind":"data","evidence":"source","sources":["mt_commit","speech"],"from":"translate"},{"id":"e7","to":"data","label":"最终译文落盘","kind":"data","evidence":"source","sources":["mt_commit"],"from":"translate"},{"id":"e8","to":"data","label":"条目与检查点","kind":"data","evidence":"source","sources":["checkpoint","kworkflow"],"from":"knowledge"},{"id":"e9","to":"relation","label":"正式条目成为关系候选","kind":"data","evidence":"source","sources":["relation_contract","relation_store"],"from":"knowledge"},{"id":"e10","to":"data","label":"关系与证据落盘","kind":"data","evidence":"source","sources":["relation_workflow","relation_store"],"from":"relation"},{"id":"e11","to":"speech","label":"按游标读取原文/译文","kind":"data","evidence":"source","sources":["speech"],"from":"data"},{"id":"e12","to":"data","label":"原子替换与纠正规则","kind":"data","evidence":"source","sources":["manual"],"from":"correction"},{"id":"e13","to":"pcm_frames","label":"音频样本","kind":"data","evidence":"source","sources":["audio","pcm"],"from":"audio_source"},{"id":"e14","to":"recognition_session","label":"PCM16 分包","kind":"data","evidence":"source","sources":["audio","asr"],"from":"pcm_frames"},{"id":"e15","to":"source_commit","label":"最终句","kind":"data","evidence":"source","sources":["asr"],"from":"recognition_session"},{"id":"e16","to":"mt_http","label":"共享预算内请求","kind":"data","evidence":"source","sources":["preview_api"],"from":"mt_preview"},{"id":"e17","to":"mt_http","label":"派发最终任务","kind":"data","evidence":"source","sources":["mt_commit"],"from":"mt_schedule"},{"id":"e18","to":"mt_commit","label":"译文提交","kind":"data","evidence":"source","sources":["mt_commit"],"from":"mt_http"},{"id":"e19","to":"speech_units","label":"顺序取文本","kind":"data","evidence":"source","sources":["speech","units"],"from":"speech_consumer"},{"id":"e20","to":"speech_synthesis","label":"逐段合成","kind":"data","evidence":"source","sources":["speech"],"from":"speech_units"},{"id":"e21","to":"speech_output","label":"音频流","kind":"data","evidence":"source","sources":["speech","playback"],"from":"speech_synthesis"},{"id":"e22","to":"speech_backpressure","label":"实际消费回报","kind":"data","evidence":"source","sources":["speech_control","player"],"from":"speech_output"},{"id":"e23","to":"caption_preview","label":"请求当前句预览","kind":"data","evidence":"source","sources":["preview","audio"],"from":"caption_original"},{"id":"e24","to":"caption_final","label":"最终结果替换预览","kind":"data","evidence":"source","sources":["audio","frontier"],"from":"caption_preview"},{"id":"e25","to":"knowledge_schedule","label":"持久任务","kind":"data","evidence":"source","sources":["kqueue"],"from":"knowledge_batch"},{"id":"e26","to":"knowledge_extract","label":"准入后抽取","kind":"data","evidence":"source","sources":["kqueue","kworkflow"],"from":"knowledge_schedule"},{"id":"e27","to":"knowledge_checkpoint","label":"合法项先保存","kind":"data","evidence":"source","sources":["kworkflow"],"from":"knowledge_extract"},{"id":"e28","to":"knowledge_repair","label":"只传可修复失败项","kind":"data","evidence":"source","sources":["kworkflow"],"from":"knowledge_extract"},{"id":"e29","to":"knowledge_checkpoint","label":"修复结果与剩余问题","kind":"data","evidence":"source","sources":["kworkflow"],"from":"knowledge_repair"},{"id":"e30","to":"relation_admission","label":"待处理窗口","kind":"data","evidence":"source","sources":["relation_queue"],"from":"relation_windows"},{"id":"e31","to":"relation_extract","label":"预约请求预算","kind":"data","evidence":"source","sources":["relation_workflow"],"from":"relation_admission"},{"id":"e32","to":"relation_commit","label":"候选关系与证据 ID","kind":"data","evidence":"source","sources":["relation_workflow"],"from":"relation_extract"},{"id":"e33","to":"relation_graph","label":"已保存图谱数据","kind":"data","evidence":"source","sources":["graph"],"from":"relation_commit"},{"id":"e34","to":"data_snapshot","label":"事务一致快照","kind":"data","evidence":"source","sources":["export"],"from":"data_records"},{"id":"e35","to":"data_import","label":"数据库备份文件","kind":"data","evidence":"source","sources":["import","export"],"from":"data_snapshot"},{"id":"e36","to":"correct_guard","label":"名称 / revision / jobId","kind":"data","evidence":"source","sources":["editor","manual"],"from":"correct_editor"},{"id":"e37","to":"correct_replace","label":"通过校验","kind":"data","evidence":"source","sources":["manual"],"from":"correct_guard"},{"id":"e38","to":"correct_rule","label":"持久化替换规则","kind":"data","evidence":"source","sources":["manual"],"from":"correct_replace"},{"id":"e39","to":"trace_events","label":"步骤起止与事件","kind":"data","evidence":"source","sources":["runtime","diagnostics"],"from":"trace_lifecycle"},{"id":"e40","to":"trace_business","label":"事件配对与归属","kind":"data","evidence":"source","sources":["business"],"from":"trace_events"},{"id":"e41","to":"trace_report","label":"聚合与异常洞察","kind":"data","evidence":"source","sources":["trace_report"],"from":"trace_business"},{"id":"e42","to":"speech_synthesis","label":"允许或暂停下一段生成","kind":"control","evidence":"source","sources":["speech"],"from":"speech_backpressure"}]}</script>
<script>
const MAX_BYTES = 15 * 1024 * 1024;
const MAX_SPANS = 15000;
const kinds = ['queue','console','processor','memory','tool','router','database','sensor','speaker','display'];
const evidences = ['source','provided','inference','demo','unknown'];
const idPattern = /^[a-z0-9][a-z0-9_-]{0,63}$/;
const MECHANICAL_ACTIONS = ['idle','enqueue','dequeue','process','read','write','retry','reject','error','complete'];
const counters = ['queueDepth','activeWorkers','retries','completed','failed','rejected'];
function need(test, message) { if (!test) throw new Error(message); }
function textField(value, label, limit = 6000) {
  need(typeof value === 'string' && value.trim().length > 0 && value.length <= limit, `${label} 必须是非空文本（最多 ${limit} 字符）`);
}
function ids(items, label, limit) {
  need(Array.isArray(items) && items.length <= limit, `${label} 必须是数组，最多 ${limit} 项`);
  const seen = new Set();
  for (const item of items) {
    need(item && typeof item.id === 'string' && idPattern.test(item.id), `${label} ID 无效`);
    need(!seen.has(item.id), `${label} ID 重复: ${item.id}`);
    seen.add(item.id);
  }
  return seen;
}
function safeUrl(value) {
  try { const u = new URL(value); return ['https:','http:'].includes(u.protocol) ? u.href : null; }
  catch { return null; }
}
function validateModel(model) {
  need(model && typeof model === 'object' && !Array.isArray(model), '模型必须是对象');
  need(model.schemaVersion === 1, 'schemaVersion 必须为 1');
  textField(model.title, 'title', 200); textField(model.summary, 'summary');
  need(['agent','software','ai-pipeline'].includes(model.template), '未知模板');
  need(['demo','architecture','trace'].includes(model.mode), '未知 mode');
  if (model.theme !== undefined) need(['light','dark'].includes(model.theme), '未知 theme');
  // Imported activity buckets have their own bounded allowance. A valid authored
  // model must remain importable when its ordinary node/domain budget is full.
  const domains = ids(model.domains, 'domains', 41), nodes = ids(model.nodes, 'nodes', 281);
  need(model.domains.filter(d => !d.traceGenerated).length <= 40, '最多 40 个业务域');
  need(model.domains.filter(d => d.traceGenerated).length <= 1, '最多一个导入生成的未归属域');
  need(model.nodes.filter(n => !n.traceGenerated).length <= 240, '最多 240 个建模部件');
  const edges = ids(model.edges, 'edges', 600), sources = ids(model.sources, 'sources', 120);
  need(domains.size > 0 && nodes.size > 0, '至少需要一个业务域和一个部件');
  for (const d of model.domains) { textField(d.name, 'domain.name', 80); textField(d.description, 'domain.description'); }
  for (const s of model.sources) {
    textField(s.title, 'source.title', 300);
    if (s.url !== undefined) need(safeUrl(s.url), '来源链接必须使用 HTTP/HTTPS');
    if (s.ref !== undefined) textField(s.ref, 'source.ref');
  }
  const byId = new Map(model.nodes.map(n => [n.id, n]));
  const evidence = item => {
    need(evidences.includes(item.evidence), `无效 evidence: ${item.id}`);
    need(Array.isArray(item.sources) && item.sources.every(s => sources.has(s)), `来源引用无效: ${item.id}`);
    need(item.evidence !== 'source' || item.sources.length > 0, `来源事实缺少证据: ${item.id}`);
  };
  const scopes = new Map();
  for (const n of model.nodes) {
    need(domains.has(n.domainId), `部件业务域不存在: ${n.id}`);

      ['mt_commit','译文完成唤醒播报','最终译文保存后广播到页面，并唤醒独立播报消费会话。临时字幕显示成功不表示这一句已可正常播报。'],
      ['speech_backpressure','生成速度要跟着播放速度','发起下一段前检查待播量与未播完单元数。4 秒是暂停继续发起的阈值；32 秒是过量保护边界。'],
      ['speech_output','听完才算播放完成','PCM 抵达浏览器只是生成和传输成功。浏览器实际消费样本、完成单元后，才回报播放进度。']
    ]},
    {title:'知识怎样可靠补全',steps:[
      ['knowledge_batch','先把定稿原文合成批次','安静 1.5 秒、3 句或 1200 字符可以触发，最多等 4 秒。这个等待之后还要经过调度、网络与模型。'],
      ['knowledge_schedule','同一收听按顺序处理','同收听串行，默认跨收听并发 2；翻译忙时最多让路 1.5 秒，并限制新的并发准入。'],
      ['knowledge_extract','模型给出候选，本地检查依据','具体对象、身份与原文引用按协议校验。合法空结果不等于处理失败。'],
      ['knowledge_repair','只补有依据的失败项','成功项已保存。定向修复锁定原对象，每分片至多一次，不重发整批成功项。'],
      ['knowledge_checkpoint','检查点支持继续处理','记录阶段、预算和未解决项。停止采音后仍可完成排队工作；重启后的模型任务还需要有效 Key。']
    ]},
    {title:'图谱为何没有连线',steps:[
      ['relation','先区分查看与生成','查看图谱使用已有数据；点击生成关系才创建模型工作。正式知识条目即使没有边也应显示。'],
      ['relation_admission','等待不等于失败','翻译、知识或播报消费者存在时关系任务让路。等待译文、安静窗口、冷却或 Key 都有不同原因。'],
      ['relation_windows','先检查输入证据','候选来自已有条目，原文是依据，最终译文只辅助理解；窗口按实际内容版本推进。'],
      ['relation_extract','共同出现不必有关系','模型只输出原文明说且证据充分的关系。没有关系可返回空数组；每窗口最多 3 次请求，不无限重试。'],
      ['relation_commit','再区分正常零结果与执行失败','空结果和候选被过滤可以正常完成。请求失败、覆盖不完整或保存问题则有后续状态；成功关系保留。'],
      ['relation_graph','图谱保留独立对象','关联组件在上方，独立条目在下方。零条边不代表知识条目消失，也不能仅凭零条边判断故障。']
    ]},
    {title:'误识别怎样被纠正',steps:[
      ['correct_editor','用户直接输入正确名称','例如 Deebo → Tibo。手动保存无需 Key，也不调用模型；建议按钮是独立且显式的请求。'],
      ['correct_guard','先检查版本与并发','条目和关联原文变化会导致 revision 不一致。409 要读回核对，不能用旧页面覆盖新内容。'],
      ['correct_replace','一次事务同步替换','更新名称、关联原文、事实和引用位置，保留对象与关系 ID。已完成译文保留，不顺带触发重译。'],
      ['correct_rule','当前收听继续沿用','替换规则持久保留，后续识别在本次收听沿用新写法；其他收听不受影响。']
    ]}
  ];
  let guideIndex=-1,guideStep=0;
  function showGuide(index,step=0){
    guideIndex=index;guideStep=step;const g=guides[index],item=g.steps[step];
    $('guide-body').hidden=false;$('guide-title').textContent=`${step+1} / ${g.steps.length} · ${item[1]}`;$('guide-text').textContent=item[2];
    $('guide-steps').innerHTML=g.steps.map((a,i)=>`<button data-guide-step="${i}" aria-current="${i===step?'step':'false'}">${i+1} · ${h(model.nodes.find(n=>n.id===a[0]).label)}</button>`).join('');
    $('guide-steps').querySelectorAll('button').forEach(b=>b.onclick=()=>showGuide(index,Number(b.dataset.guideStep)));
    $('guide-choices').querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===index)));
    focusNode(item[0]);
  }
  $('guide-choices').innerHTML=guides.map((g,i)=>`<button data-guide="${i}" aria-pressed="false">${g.title} →</button>`).join('');
  $('guide-choices').querySelectorAll('button').forEach(b=>b.onclick=()=>showGuide(Number(b.dataset.guide)));
  $('guide-home').onclick=()=>{guideIndex=-1;$('guide-body').hidden=true;$('guide-choices').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed','false'));pause();resetNavigation();draw();};

  resetNavigation();draw();
  if(model.mode==='demo')notify('这是合成教学场景。播放查看机制，点击部件检查输入输出；导入实际 Trace 后才显示度量。');
  else if(model.mode==='trace'&&model.traceMeta?.synthetic)notify('这是合成 Trace 示例。数值仅用于验证回放和错误下钻，不代表真实项目性能。');
})();

</script>
